services:
  db:
    # pgvector/pgvector:pg16 is the official postgres:16 image with the `vector`
    # extension preinstalled — required for the ICD-10 embedding similarity search
    # (see backend/prisma/schema.prisma `IcdCode.embedding`). Same PG16 engine, so the
    # existing data volume mounts unchanged; only the container is recreated.
    image: pgvector/pgvector:pg16
    container_name: patients-qa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patients_qa
    ports:
      # Host 5433 -> container 5432 to avoid clashing with other local Postgres
      # instances already bound to 5432.
      - "5433:5432"
    volumes:
      - patients_qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patients_qa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  patients_qa_pgdata:
